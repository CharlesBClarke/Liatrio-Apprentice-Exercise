name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: docker build -t liatrio-exercise:ci .

      - name: Run container
        run: |
          docker run -d --name app -p 80:80 liatrio-exercise:ci
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:80/ > /dev/null

      - name: Run apprentice-action tests
        uses: liatrio/github-actions/apprentice-action@0b41561cca6822cc8d880fe0e49e7807a41fdf91

      - name: Verify response is minified JSON
        run: |
          body=$(curl --silent --fail http://localhost:80/)
          echo "Response: $body"
          test "$body" = "$(echo "$body" | jq --compact-output .)"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Tag and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/liatrio-apprentice-exercise
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          docker tag liatrio-exercise:ci "$IMAGE:$VERSION"
          docker tag liatrio-exercise:ci "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Pushed version $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: always()
        run: docker logs app
